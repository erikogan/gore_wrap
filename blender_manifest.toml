schema_version = "1.0.0"

id = "gore_wrap"
version = "0.6.0"
name = "Gore Wrap"
tagline = "Flatten scanned meshes into gore strips and export SVG"
maintainer = "Erik Ogan <erik@ogan.net>"
type = "add-on"

website = "https://github.com/"

tags = ["Mesh", "Import-Export", "3D View"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

# svgelements is a pure-Python universal wheel (no transitive deps); numpy
# ships with Blender, so it needs no wheel.
wheels = ["./wheels/svgelements-1.9.6-py2.py3-none-any.whl"]
platforms = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]
