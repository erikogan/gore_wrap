schema_version = "1.0.0"

id = "gore_wrap"
version = "0.7.2"
name = "Gore Wrap"
tagline = "Flatten scanned meshes into gore strips and export SVG"
maintainer = "Erik Ogan <erik@ogan.net>"
type = "add-on"

website = "https://github.com/erikogan/gore_wrap"

# Allowed:
#    3D View, Add Curve, Add Mesh, All, Animation, Bake, Camera, Compositing,
#    Development, Game Engine, Geometry Nodes, Grease Pencil, Import-Export,
#    Lighting, Material, Mesh, Modeling, Node, Object, Paint, Physics, Pipeline,
#    Render, Rigging, Scene, Sculpt, Sequencer, System, Text Editor, Tracking,
#    UV, User Interface
tags = ["Mesh", "Import-Export", "3D View"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

# svgelements is a pure-Python universal wheel (no transitive deps); numpy
# ships with Blender, so it needs no wheel.
wheels = ["./wheels/svgelements-1.9.6-py2.py3-none-any.whl"]
platforms = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]

# An allow list, not an exclude list: a file that is not named here is not
# packaged. That way new development files (tests, notes, scratch scripts)
# never ship by accident -- the cost is that a genuinely new module must be
# added below, which tests/test_manifest.py enforces.
#
# blender_manifest.toml and the wheels are deliberately absent: Blender adds
# both implicitly, and listing them is a validation error.
[build]
paths = [
  "LICENSE",
  "__init__.py",
  "bezier_fit.py",
  "export_job.py",
  "geometry.py",
  "operators.py",
  "pattern_warp.py",
  "pipeline.py",
  "properties.py",
  "registry.py",
  "svg_export.py",
  "ui.py",
]
